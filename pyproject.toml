[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vq-fragment-tokenizer"
version = "0.1.0"
description = "Standalone VQ tokenizer prototype for fragment-resolved MS/MS spectra."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
hdf5 = ["h5py>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
